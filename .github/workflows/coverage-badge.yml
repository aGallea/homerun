name: Coverage

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: homerun-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Measure coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run React tests with coverage
        working-directory: apps/desktop
        run: npm run test:coverage

      - name: Verify Rust lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Run Rust tests with coverage
        run: cargo llvm-cov -p homerund -p homerun --all-features --summary-only 2>&1 | tee coverage-summary.txt

      - name: Parse line coverage
        id: coverage
        run: |
          set -euo pipefail
          COVERAGE=$(grep "^TOTAL" coverage-summary.txt | grep -oE '[0-9]+\.[0-9]+%' | sed -n '3p' | sed 's/%//')
          if ! [[ "$COVERAGE" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::Could not parse line coverage from coverage-summary.txt"
            cat coverage-summary.txt
            exit 1
          fi
          echo "value=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Report coverage
        env:
          COVERAGE: ${{ steps.coverage.outputs.value }}
        run: |
          set -euo pipefail
          echo "Coverage: $COVERAGE%"
          {
            echo "### Coverage"
            echo
            echo "Line coverage: **$COVERAGE%**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean generated artifacts
        if: always()
        run: |
          cargo clean
          rm -rf apps/desktop/coverage
