name: Release Build

on:
  push:
    tags: ["v*"]
  # Manual trigger to validate the build jobs (macOS/Windows/Linux) on any ref
  # without cutting a release. The release + tap-update jobs are gated to tag
  # pushes below, so a dispatch only builds and uploads artifacts.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            runner: macos-14 # Apple Silicon
          - target: x86_64-apple-darwin
            arch: x86_64
            # Cross-compile the Intel target on an Apple Silicon runner —
            # GitHub's Intel (macos-13) hosted runners are scarce/being retired
            # and can queue indefinitely; arm64 macOS builds both targets fine.
            runner: macos-14

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify Tauri lockfile
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build homerund sidecar
        run: |
          cargo build --locked --release -p homerund --target ${{ matrix.target }}
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/${{ matrix.target }}/release/homerund \
            apps/desktop/src-tauri/binaries/homerund-${{ matrix.target }}

      - name: Build homerun CLI
        run: cargo build --locked --release -p homerun --target ${{ matrix.target }}

      - name: Package CLI binaries
        run: |
          mkdir -p cli-dist
          cp target/${{ matrix.target }}/release/homerun cli-dist/
          cp target/${{ matrix.target }}/release/homerund cli-dist/
          # ref_name is a tag (no slash) for releases; sanitize so a
          # workflow_dispatch from a slash-containing branch still names files.
          REF="${GITHUB_REF_NAME//\//-}"
          tar -czf "homerun-${REF}-${{ matrix.target }}.tar.gz" -C cli-dist .

      - name: Upload CLI tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.arch }}
          path: homerun-*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeRun-${{ matrix.arch }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Tauri lockfile
        shell: pwsh
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > $null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate Windows icon
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli icon src-tauri/icons/icon.png

      - name: Build homerund sidecar
        run: |
          cargo build --locked --release -p homerund
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Copy-Item target/release/homerund.exe apps/desktop/src-tauri/binaries/homerund-x86_64-pc-windows-msvc.exe
        shell: pwsh

      - name: Build homerun CLI
        run: cargo build --locked --release -p homerun

      - name: Package CLI binaries
        run: |
          New-Item -ItemType Directory -Force -Path cli-dist
          Copy-Item target/release/homerun.exe cli-dist/
          Copy-Item target/release/homerund.exe cli-dist/
          $ref = "${env:GITHUB_REF_NAME}" -replace '/', '-'
          Compress-Archive -Path cli-dist/* -DestinationPath "homerun-$ref-x86_64-pc-windows-msvc.zip"
        shell: pwsh

      - name: Upload CLI zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows-x64
          path: homerun-*.zip
          if-no-files-found: error
          retention-days: 1

      - name: Build Tauri app (MSI + NSIS)
        working-directory: apps/desktop
        run: npx tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeRun-windows-x64-msi
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 1

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeRun-windows-x64-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 1

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Tauri lockfile
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build homerund sidecar
        run: |
          cargo build --locked --release -p homerund
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/homerund \
            apps/desktop/src-tauri/binaries/homerund-x86_64-unknown-linux-gnu

      - name: Build homerun CLI
        run: cargo build --locked --release -p homerun

      - name: Package CLI binaries
        run: |
          mkdir -p cli-dist
          cp target/release/homerun cli-dist/
          cp target/release/homerund cli-dist/
          REF="${GITHUB_REF_NAME//\//-}"
          tar -czf "homerun-${REF}-x86_64-unknown-linux-gnu.tar.gz" -C cli-dist .

      - name: Upload CLI tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x64
          path: homerun-*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Build Tauri app (AppImage + deb)
        working-directory: apps/desktop
        run: npx tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeRun-linux-x64-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 1

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeRun-linux-x64-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
          draft: false
          generate_release_notes: true

  update-tap:
    name: Update Homebrew Tap
    needs: release
    if: ${{ github.ref_type == 'tag' && vars.HOMEBREW_TAP_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 hashes and dispatch
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_CLI_ARM=$(sha256sum artifacts/homerun-v${VERSION}-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_CLI_X86=$(sha256sum artifacts/homerun-v${VERSION}-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_DMG_ARM=$(sha256sum artifacts/HomeRun_${VERSION}_aarch64.dmg | awk '{print $1}')
          SHA_DMG_X86=$(sha256sum artifacts/HomeRun_${VERSION}_x64.dmg | awk '{print $1}')

          gh api "repos/${HOMEBREW_TAP_REPOSITORY}/dispatches" \
            --method POST \
            -f event_type=update-tap \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[sha256_cli_arm64]=${SHA_CLI_ARM}" \
            -f "client_payload[sha256_cli_x86_64]=${SHA_CLI_X86}" \
            -f "client_payload[sha256_dmg_arm64]=${SHA_DMG_ARM}" \
            -f "client_payload[sha256_dmg_x86_64]=${SHA_DMG_X86}"
