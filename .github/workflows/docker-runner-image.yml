name: Docker Runner Image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push runner images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/runner-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/homerun-runner:ubuntu-24.04
            ghcr.io/${{ github.repository_owner }}/homerun-runner:${{ github.ref_name }}

      - name: Build and push (rust)
        uses: docker/build-push-action@v6
        with:
          context: docker/runner-rust
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/homerun-runner:rust
            ghcr.io/${{ github.repository_owner }}/homerun-runner:rust-${{ github.ref_name }}
