name: Docker Runner Image

on:
  push:
    tags: ["v*"]
  # Allow publishing the runner images (base + rust) on demand, without
  # waiting for a release tag — e.g. to make a new/updated image available to
  # runners before the next release. Uses github.ref_name for the extra tag.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push runner images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only a release tag or a build from master may move the floating
      # `:ubuntu-24.04` / `:rust` tags that every runner pulls by default. A
      # workflow_dispatch from any other branch publishes ONLY a branch-scoped
      # tag, so an ad-hoc build can be tested without silently shipping an
      # unintended image to all runners. ref_name is slash-sanitized for tags.
      - name: Compute image tags
        id: meta
        run: |
          # GHCR repository names must be lowercase; github.repository_owner
          # preserves the account's original case (e.g. "aGallea").
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER}/homerun-runner"
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.ref_name }}" = "master" ]; then
            BASE_TAGS="${REPO}:ubuntu-24.04"$'\n'"${REPO}:${SAFE_REF}"
            RUST_TAGS="${REPO}:rust"$'\n'"${REPO}:rust-${SAFE_REF}"
          else
            BASE_TAGS="${REPO}:branch-${SAFE_REF}"
            RUST_TAGS="${REPO}:rust-branch-${SAFE_REF}"
          fi
          {
            echo "base_tags<<EOF"; printf '%s\n' "$BASE_TAGS"; echo "EOF"
            echo "rust_tags<<EOF"; printf '%s\n' "$RUST_TAGS"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/runner-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.base_tags }}

      - name: Build and push (rust)
        uses: docker/build-push-action@v6
        with:
          context: docker/runner-rust
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.rust_tags }}
