name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: homerun-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  ubuntu-quality:
    name: Ubuntu quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install quality tools
        run: |
          python -m pip install --disable-pip-version-check pre-commit

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      - name: Run pre-commit checks
        env:
          SKIP: no-commit-to-branch,cargo-test,cargo-clippy
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run React tests with coverage
        working-directory: apps/desktop
        run: npm run test:coverage

      - name: Type check
        working-directory: apps/desktop
        run: npm exec -- tsc --noEmit

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Verify Rust lockfiles
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > /dev/null

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Tauri formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets

      - name: Run Rust clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build release binaries
        run: cargo build --locked --release -p homerun -p homerund

      - name: Smoke-test CLI
        run: ./target/release/homerun --help

      - name: Run Rust tests with coverage
        run: cargo llvm-cov -p homerund -p homerun --all-features --lcov --output-path rust-lcov.info

      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar

      - name: Test Tauri crate
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

      - name: Lint Tauri crate
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Merge coverage reports
        run: |
          sed 's|^SF:src/|SF:apps/desktop/src/|' apps/desktop/coverage/lcov.info > react-lcov-fixed.info
          cat rust-lcov.info react-lcov-fixed.info > lcov.info

      - name: Coverage report
        if: always() && hashFiles('lcov.info') != ''
        continue-on-error: true
        uses: aGallea/tests-coverage-report@1.3.14
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-path: ./lcov.info
          diffcover-ref: lcov
          show-junit: false
          show-diffcover: true
          min-coverage-percentage: "80"
          fail-under-coverage-percentage: "false"

      - name: Clean generated artifacts
        if: always()
        run: |
          cargo clean
          cargo clean --manifest-path apps/desktop/src-tauri/Cargo.toml
          rm -rf apps/desktop/src-tauri/binaries

  windows-quality:
    name: Windows quality gate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify Rust lockfiles
        shell: pwsh
        run: |
          cargo metadata --locked --no-deps --format-version 1 > $null
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 > $null

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Tauri formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets

      - name: Run Rust clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build release binaries
        run: cargo build --locked --release -p homerun -p homerund

      - name: Smoke-test CLI
        shell: pwsh
        run: .\target\release\homerun.exe --help

      - name: Prepare Tauri sidecar
        working-directory: apps/desktop
        run: npm run prepare-sidecar

      - name: Test Tauri crate
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets

      - name: Lint Tauri crate
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
